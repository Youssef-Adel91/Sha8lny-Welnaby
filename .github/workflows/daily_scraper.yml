name: Daily Freelance Data Scraper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable verbose Python logging (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scrape-and-commit:
    name: "Scrape → Store → Commit"
    runs-on: ubuntu-latest

    concurrency:
      group: scraper-pipeline
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        run: |
          python scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add freelance_data.json

          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in freelance_data.json — nothing to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            TRIGGER="${{ github.event_name }}"

            git commit -m "chore(data): auto-update freelance_data.json
            
            Triggered by : ${TRIGGER}
            Run timestamp: ${TIMESTAMP}
            Workflow run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            git push
            echo "✅ freelance_data.json committed and pushed successfully."
          fi

      - name: Upload freelance_data.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: freelance-data-${{ github.run_id }}
          path: freelance_data.json
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 Freelance Market Monitor — Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runner OS** | \`${{ runner.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python** | 3.11 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp (UTC)** | $(date -u +'%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f freelance_data.json ]; then
            RECORDS=$(python3 -c "import json; d=json.load(open('freelance_data.json')); print(d.get('metadata', {}).get('total_records', 'unknown'))" 2>/dev/null || echo "unknown")
            echo "| **Records collected** | **${RECORDS}** |" >> $GITHUB_STEP_SUMMARY
          fi
